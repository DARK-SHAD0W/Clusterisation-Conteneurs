# Local Docker Swarm cluster: each "machine" is a Docker-in-Docker container
name: swarm

services:
  manager:
    image: docker:dind
    hostname: manager
    privileged: true
    ports:
      - "80:80" # Traefik, reachable from the host browser
      - "443:443" # Traefik HTTPS (TD4: Authelia only works over https)
    volumes:
      - /home/manager

  node1:
    image: docker:dind
    hostname: node1
    privileged: true

  node2:
    image: docker:dind
    hostname: node2
    privileged: true

  node3:
    image: docker:dind
    hostname: node3
    privileged: true
