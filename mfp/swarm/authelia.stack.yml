# Authelia (TD4 ex. 1.2): login portal and OpenID Connect provider, on authelia.swarm.localhost.
# Its configuration is a swarm config, the account and every key are swarm secrets.
services:
  authelia:
    image: authelia/authelia:4.39
    environment:
      X_AUTHELIA_CONFIG: /config/configuration.yml
      X_AUTHELIA_CONFIG_FILTERS: template # enables {{ secret "..." }} in the configuration
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/authelia_jwt_secret
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/authelia_session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/authelia_storage_key
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /run/secrets/authelia_oidc_hmac
      TZ: Europe/Paris
    configs:
      - source: authelia_config
        target: /config/configuration.yml
    secrets:
      - source: authelia_users
        target: /config/users_database.yml # the account(s)
      - authelia_jwt_secret
      - authelia_session_secret
      - authelia_storage_key
      - authelia_oidc_hmac
      - authelia_oidc_key # private key that signs the OpenID Connect tokens
    volumes:
      - authelia_data:/data # SQLite database and notifications
    networks:
      - web
    deploy:
      placement:
        constraints:
          - node.role == manager # the SQLite volume stays on the same node
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.authelia.rule=Host(`authelia.swarm.localhost`)"
        - "traefik.http.routers.authelia.entrypoints=websecure"
        - "traefik.http.services.authelia.loadbalancer.server.port=9091"

networks:
  web:
    external: true

volumes:
  authelia_data:

# Created beforehand with `docker config create` and `docker secret create`
configs:
  authelia_config:
    external: true

secrets:
  authelia_users:
    external: true
  authelia_jwt_secret:
    external: true
  authelia_session_secret:
    external: true
  authelia_storage_key:
    external: true
  authelia_oidc_hmac:
    external: true
  authelia_oidc_key:
    external: true
