info:
  name: 03 - My profile
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:3000/api/users/me
  headers:
    - name: Authorization
      value: Bearer {{token}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function () {
          expect(res.status).to.equal(200);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Returns the logged-in user (Authorization: Bearer {{token}} header).
